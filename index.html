<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>သီတင်းကျွတ် အလှူတော်စာရင်း</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Pyidaungsu', sans-serif; background-color: #fff3e0; text-align: center; padding: 20px; }
        h2 { color: #d32f2f; margin-bottom: 5px; }
        .subtitle { color: #555; margin-bottom: 20px; }
        .donation-box { background: white; margin: 10px auto; padding: 15px; max-width: 350px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-left: 5px solid #d32f2f; text-align: left; display: flex; align-items: center; gap: 15px; }
        .lantern { font-size: 2em; }
        .details { display: flex; flex-direction: column; }
        .name { font-weight: bold; font-size: 1.1em; color: #333; }
        .amount { color: #2e7d32; font-weight: bold; font-size: 1.1em; }
        .error-msg { color: red; font-size: 0.9em; margin-top: 20px; word-break: break-all; }
    </style>
</head>
<body>

    <h2>🏮 သီတင်းကျွတ် အလှူတော်စာရင်း 🏮</h2>
    <p class="subtitle">ပါဝင်လှူဒါန်းကြသော ကုသိုလ်ရှင်များ</p>

    <div id="donations-list">
        <p>စာရင်းများ ရယူနေပါသည်...</p>
    </div>

    <script>
        const SUPABASE_URL = 'https://oqulntrmixnlgbkkryhk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xdWxudHJtaXhubGdia2tyeWhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1MDcyMDcsImV4cCI6MjEwNzA4MzIwN30.t-BNmpxLySUBG052Tmisnc-FcXv6BEIyVBpU-R_rDeo';

        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadDonations() {
            try {
                const { data, error } = await dbClient
                    .from('donations')
                    .select('*')
                    .order('created_at', { ascending: false });

                const listDiv = document.getElementById('donations-list');
                
                if (error) {
                    listDiv.innerHTML = `<p style="color:red; font-weight:bold;">Error: ${error.message} (Code: ${error.code})</p>`;
                    return;
                }

                if (!data || data.length === 0) {
                    listDiv.innerHTML = '<p>အလှူရှင်စာရင်း မရှိသေးပါ။</p>';
                    return;
                }

                listDiv.innerHTML = ''; 
                data.forEach(donation => {
                    const item = document.createElement('div');
                    item.className = 'donation-box';
                    item.innerHTML = `
                        <div class="lantern">🏮</div>
                        <div class="details">
                            <span class="name">${donation.name}</span>
                            <span class="amount">${donation.amount}</span>
                        </div>
                    `;
                    listDiv.appendChild(item);
                });
            } catch (err) {
                document.getElementById('donations-list').innerHTML = `<p style="color:red; font-weight:bold;">System Error: ${err.message}</p>`;
            }
        }

        loadDonations();
    </script>
</body>
</html>
